name: Claude Review

# AI code review on pull requests. Advisory: it comments, it does not gate.
#
# `pull_request` (not `pull_request_target`) on purpose: PRs from forks get no
# repository secrets and a read-only token, so a stranger's PR can neither read
# credentials nor make this workflow do anything with write access. The repo is
# public, so that matters. Fork PRs simply skip review.
on:
  # No `synchronize`: reviewing every push multiplies cost. Comment `@claude
  # review` (see claude.yml) to request another pass after follow-up commits.
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Off until the Anthropic workload-identity federation rule works for this
    # repo; set the repository variable CLAUDE_REVIEW_ENABLED to 'true' to turn
    # it on. While off the job is skipped, not failed.
    # Skip drafts, Dependabot (no secret access) and fork PRs (no secret access).
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for enjoysenoia, the Senoia tourism site
            (React + Vite, Firebase Hosting on three sites, Firestore, Storage,
            an admin portal for staff). Merging to main deploys to production.

            Prioritise, in order:
            1. Correctness bugs and anything that could blank a page or lose
               data: Firestore values read without handling missing fields,
               `undefined` written to Firestore, queries that need an index
               not in firestore.indexes.json, routes that 404 on the
               micro-sites.
            2. Security: changes to firestore.rules or storage.rules (is there
               a matching case in scripts/*-rules.test.mjs?), widened
               admin/staff access, public writes, admin checks done only in
               the client, hardcoded keys or tokens, unsanitised HTML (the
               News editor renders stored HTML; DOMPurify must stay in path).
            3. Deploy-breaking changes: edits to firebase.json (hosting
               targets main/masquerade/halloween, redirects, headers),
               build scripts under scripts/, the sitemap generator, or
               VITE_* config that CI/deploy do not set.
            4. App Check: enforcement is deliberately OFF. Flag any change
               that turns it on, and flag anything that would make Storage
               enforced under any circumstances.
            5. Missing tests for changed rules or sitemap logic.

            Do not comment on style, formatting or things oxlint already
            catches. Do not restate the diff. Be concise: use inline comments
            for specific issues and one short top-level summary with a
            verdict. If there is nothing worth flagging, say so in one line.

            Use the inline-comment and `gh pr` tools to post feedback.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
